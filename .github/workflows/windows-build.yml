name: Build (Windows)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm (Equicord's build)
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm test

      - name: Build Windows installer
        run: npm run tauri -- build --config scripts/ci-tauri.conf.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-windows-ci-installer-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # A CI build alone is not an updater release. Publish only after the signed
      # installer, manifest, matching source and checksums have all been verified.
