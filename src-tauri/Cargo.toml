[package]
name = "xray"
version = "0.5.13"
description = "xray â€” a lightweight Discord client"
authors = ["xray"]
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Small, synchronous HTTP client for forwarding logs (report.rs). rustls, so
# there's no system OpenSSL dependency on the build machine.
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
tauri-plugin-updater = "2.14"
tauri-plugin-dialog = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.7.3"
winreg = "0.56.0"
# Hotkey hooks (hotkeys.rs). Same version Tauri's windowing already links, so no second copy is compiled.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
